<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECO-MAS - Comerciante</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- Leaflet CSS y JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      background-color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .app-screen {
      max-width: 420px;
      min-height: 100vh;
      margin: 0 auto;
      background: white;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }

    #map {
      height: 210px;
      width: 100%;
      border-radius: 1rem;
      z-index: 1;
    }
  </style>
</head>

<body>

  <div class="app-screen p-6">

    <!-- PASO 1: REGISTRO -->
    <div id="step-register">
      <a href="index.html"
        class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-700 mb-4 hover:bg-gray-200 inline-flex">
        <i class="fa-solid fa-arrow-left"></i>
      </a>

      <h2 class="text-2xl font-bold text-gray-800">Bienvenido Comerciante</h2>
      <p class="text-xs text-gray-500 mb-6">Ingresa tus datos personales para continuar</p>

      <form class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Nombre Completo</label>
          <input type="text" id="fullname" required placeholder="Ej. Juan Pérez"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">DNI</label>
          <input type="text" id="dni" required maxlength="8" placeholder="8 dígitos"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Correo Electrónico</label>
          <input type="email" id="email" required placeholder="ejemplo@correo.com"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div class="p-3 bg-gray-50 rounded-xl border border-gray-200 mt-2">
          <label class="flex items-start gap-3 cursor-pointer">
            <input type="checkbox" id="location-check" onchange="toggleNextButton()"
              class="mt-1 w-4 h-4 text-emerald-600 rounded border-gray-300">
            <span class="text-xs text-gray-600">Acepto compartir mi ubicación para fijar la posición de mi puesto en
              Comas.</span>
          </label>
        </div>

        <button type="button" id="btn-next" onclick="goToStallCreation()" disabled
          class="w-full mt-4 bg-gray-300 text-gray-500 font-bold py-3.5 rounded-xl transition cursor-not-allowed">
          Siguiente
        </button>
      </form>
    </div>

    <!-- PASO 2: MAPA Y CREACIÓN DE PUESTO -->
    <div id="step-stall" class="hidden">
      <button onclick="backToRegister()"
        class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-700 mb-4 hover:bg-gray-200 inline-flex">
        <i class="fa-solid fa-arrow-left"></i>
      </button>

      <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3 mb-4">
        <p class="text-[10px] text-emerald-800 font-bold uppercase">Cuenta Registrada</p>
        <h3 id="display-name" class="text-sm font-bold text-emerald-950">---</h3>
      </div>

      <h3 class="text-base font-bold text-gray-800 mb-1">Ubicación de tu Puesto</h3>
      <p class="text-xs text-emerald-700 font-medium mb-2">Toca el mapa en la zona de Comas donde está tu local:</p>

      <div class="mb-4">
        <div id="map" class="border-2 border-emerald-500 shadow-sm"></div>
        <p id="map-status" class="text-[11px] text-amber-600 font-bold mt-1">
          <i class="fa-solid fa-hand-pointer"></i> Haz clic en el mapa para marcar tu posición.
        </p>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Nombre del Puesto</label>
          <input type="text" id="stall-name" placeholder="Ej. Pollos Broaster"
            class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Horario de Atención</label>
          <input type="text" id="stall-hours" placeholder="Ej. Lun-Sab 4:00 PM - 11:00 PM"
            class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Foto del Puesto</label>
          <label for="stall-file"
            class="flex flex-col items-center justify-center w-full h-24 border-2 border-dashed border-emerald-400 bg-emerald-50/50 hover:bg-emerald-50 rounded-xl cursor-pointer">
            <i class="fa-solid fa-camera text-emerald-600 text-lg mb-1"></i>
            <span class="text-xs font-bold text-emerald-800">Seleccionar foto de galería</span>
            <input id="stall-file" type="file" accept="image/*" class="hidden" />
          </label>
          <div id="image-preview-container" class="hidden mt-2">
            <img id="image-preview" src="" class="w-full h-28 object-cover rounded-xl border">
          </div>
        </div>

        <button type="button" id="btn-save" onclick="saveStallFirebase()"
          class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition active:scale-95 text-sm">
          Guardar Puesto en ECO-MAS
        </button>
      </div>
    </div>

  </div>

  <!-- CONFIGURACIÓN DE FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBqcj0xWWzm8eJhmjJRqMi-JAnK9ZsY1nY",
      authDomain: "eco-mas.firebaseapp.com",
      projectId: "eco-mas",
      storageBucket: "eco-mas.firebasestorage.app",
      messagingSenderId: "502823626093",
      appId: "1:502823626093:web:439061eebcc45b5b0fe664"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let uploadedImageData = "";
    let selectedLat = null;
    let selectedLng = null;
    let map = null;
    let marker = null;

    window.toggleNextButton = function () {
      const check = document.getElementById('location-check').checked;
      const btn = document.getElementById('btn-next');
      if (check) {
        btn.disabled = false;
        btn.className = "w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow-md active:scale-95";
      } else {
        btn.disabled = true;
        btn.className = "w-full mt-4 bg-gray-300 text-gray-500 font-bold py-3.5 rounded-xl transition cursor-not-allowed";
      }
    };

    window.goToStallCreation = function () {
      const name = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const dni = document.getElementById('dni').value.trim();

      if (!name || !email || !dni) {
        alert('Por favor completa todos tus datos personales.');
        return;
      }

      document.getElementById('display-name').innerText = name;
      document.getElementById('step-register').classList.add('hidden');
      document.getElementById('step-stall').classList.remove('hidden');

      setTimeout(() => { initMap(); }, 200);
    };

    function initMap() {
      if (map) return;
      const comasCoords = [-11.9138352, -77.0235232];
      map = L.map('map').setView(comasCoords, 15);

      // CAPA GRATUITA DE OPENSTREETMAP (SIN MARCA DE AGUA NI API KEY)
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      map.on('click', function (e) {
        selectedLat = e.latlng.lat;
        selectedLng = e.latlng.lng;

        if (marker) {
          marker.setLatLng(e.latlng);
        } else {
          marker = L.marker(e.latlng).addTo(map);
        }

        document.getElementById('map-status').className = "text-[11px] text-emerald-600 font-bold mt-1";
        document.getElementById('map-status').innerHTML = `<i class="fa-solid fa-circle-check"></i> Ubicación fijada correctamente.`;
      });
    }

    window.backToRegister = function () {
      document.getElementById('step-stall').classList.add('hidden');
      document.getElementById('step-register').classList.remove('hidden');
    };

    document.getElementById('stall-file').addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          uploadedImageData = e.target.result;
          document.getElementById('image-preview').src = uploadedImageData;
          document.getElementById('image-preview-container').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    window.saveStallFirebase = async function () {
      const name = document.getElementById('stall-name').value.trim();
      const hours = document.getElementById('stall-hours').value.trim();
      const saveBtn = document.getElementById('btn-save');

      if (!selectedLat || !selectedLng) {
        alert('Por favor haz clic en el mapa para marcar dónde está tu puesto.');
        return;
      }
      if (!name || !hours) {
        alert('Por favor completa el nombre del puesto y el horario.');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "Guardando en Firebase...";

      let finalPhoto = uploadedImageData || 'https://images.unsplash.com/photo-1562967914-608f82629710?w=500&auto=format&fit=crop';

      try {
        await addDoc(collection(db, "stalls"), {
          name: name,
          lat: selectedLat,
          lng: selectedLng,
          hours: hours,
          photo: finalPhoto,
          reviews: [
            { text: "Cocinas muy bien y es muy rica la comida, pero no hay tachos de basura.", stars: 4 }
          ],
          createdAt: new Date()
        });

        alert('¡Puesto guardado exitosamente en la Nube de Firebase!');
        window.location.href = 'index.html';
      } catch (error) {
        console.error("Error guardando en Firebase: ", error);
        alert('Ocurrió un error al guardar en la nube.');
        saveBtn.disabled = false;
        saveBtn.innerText = "Guardar Puesto en ECO-MAS";
      }
    };

    window.goToStallCreation = function () {
      // ... tu código anterior para ocultar paso 1 y mostrar paso 2 ...
      document.getElementById('step-register').classList.add('hidden');
      document.getElementById('step-stall').classList.remove('hidden');

      // Forzar a Leaflet a calcular el tamaño del mapa 300ms después
      setTimeout(() => {
        initMap();
        if (map) {
          map.invalidateSize();
        }
      }, 300);
    };


  </script>
</body>

</html>
